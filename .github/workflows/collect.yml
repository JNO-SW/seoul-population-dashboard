# 서울시 실시간 인구데이터 자동 수집
# 1시간마다 collector/collect.py 를 실행하고, 결과를 data 브랜치에 저장한다.
# (main 브랜치 기록이 수집 커밋으로 지저분해지지 않도록 브랜치를 분리)
name: 인구 데이터 수집

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (정각은 GitHub 서버가 붐벼서 밀리기 쉬움)
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 받기 (main)
        uses: actions/checkout@v4

      - name: 데이터 브랜치 받기 (data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: databranch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install requests pandas openpyxl

      - name: 수집 (인구데이터)
        id: ppltn
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          RAW_DIR: databranch/data/raw
        run: python collector/collect.py

      - name: 수집 (도시데이터 요약)
        id: city
        continue-on-error: true
        env:
          SEOUL_CITYDATA_KEY: ${{ secrets.SEOUL_CITYDATA_KEY }}
          CITY_RAW_DIR: databranch/data/raw_city
          SAMPLE_DIR: databranch/data/samples
        run: python collector/collect_city.py

      - name: 저장
        working-directory: databranch
        run: |
          git config user.name "JNO-SW"
          git config user.email "ljh030815@gmail.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            sleep 5
          done
          exit 1

      - name: 결과 확인
        if: steps.ppltn.outcome == 'failure' || steps.city.outcome == 'failure'
        run: |
          echo "인구데이터: ${{ steps.ppltn.outcome }} / 도시데이터: ${{ steps.city.outcome }}"
          exit 1
