# 서울시 실시간 인구·도시데이터 자동 수집
# 결과는 data 브랜치에 저장한다. (main 기록이 수집 커밋으로 지저분해지지 않도록 분리)
#
# GitHub 예약 실행은 몇 시간씩 밀리거나 빠지는 일이 잦아서,
# 한 번 실행되면 collector/run_loop.sh 가 약 5시간 반 동안 매시 7분마다 수집을 반복한다.
# 그 사이 들어온 예약 실행은 1개만 대기하고(나머지는 취소로 표시됨), 앞 실행이 끝나면 이어받는다.
name: 인구 데이터 수집

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
      SEOUL_CITYDATA_KEY: ${{ secrets.SEOUL_CITYDATA_KEY }}
      RAW_DIR: databranch/data/raw
      CITY_RAW_DIR: databranch/data/raw_city
      SAMPLE_DIR: databranch/data/samples
    steps:
      - name: 코드 받기 (main)
        uses: actions/checkout@v4

      - name: 데이터 브랜치 받기 (data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: databranch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install requests pandas openpyxl

      - name: 수집 반복 (약 5시간 반)
        run: |
          cd databranch
          git config user.name "JNO-SW"
          git config user.email "ljh030815@gmail.com"
          cd ..
          bash collector/run_loop.sh
